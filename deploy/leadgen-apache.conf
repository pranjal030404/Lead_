# Apache reverse proxy for Arthvex LeadGen.
#
# The app binds 127.0.0.1:8000 on purpose and must not be exposed directly;
# Apache terminates TLS and proxies to it. Requires the proxy, proxy_http and
# headers modules:
#
#   sudo a2enmod proxy proxy_http headers ssl
#
# Install, then get a certificate (certbot rewrites this file for TLS and
# wires up auto-renewal):
#
#   sudo cp deploy/leadgen-apache.conf /etc/apache2/sites-available/leadgen.conf
#   sudo a2ensite leadgen
#   sudo systemctl reload apache2
#   sudo certbot --apache -d leadgen.example.com
#
# Before enabling TLS set COOKIE_SECURE=true and TRUST_PROXY=true in .env, or
# the session cookie is silently dropped over HTTPS and login looks broken.

<VirtualHost *:80>
    ServerName leadgen.example.com

    Redirect permanent / https://leadgen.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName leadgen.example.com

    ErrorLog ${APACHE_LOG_DIR}/leadgen-error.log
    CustomLog ${APACHE_LOG_DIR}/leadgen-access.log combined

    # Let the app know the visitor came over HTTPS. mod_proxy already appends
    # the real client IP to X-Forwarded-For (ProxyAddHeaders is on by default)
    # and the rate limiter keys on its first entry - don't add mod_remoteip /
    # RemoteIPHeader here or the header gets double-stamped.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPreserveHost On

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    <Proxy *>
        Require all granted
    </Proxy>

    # Security headers - mirror of deploy/Caddyfile. The app sets its own
    # Cache-Control on /static (revalidate every load), so nothing here
    # overrides it.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    # certbot --apache inserts the SSLCertificateFile/SSLCertificateKeyFile
    # directives and a redirect below this point. Don't add DocumentRoot:
    # every request is proxied, and the app's .env and data/ must stay off
    # the filesystem namespace served by Apache.
</VirtualHost>